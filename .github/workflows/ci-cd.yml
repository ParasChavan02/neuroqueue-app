name: ci-cd

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  INFRA_REPO: ${{ vars.INFRA_REPO }}
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/neuroqueue-frontend
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/neuroqueue-backend
  WORKER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/neuroqueue-worker

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Install worker dependencies
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: |
            VITE_API_URL=/api

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: ${{ env.WORKER_IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo

      - name: Update image tags in infra repo
        working-directory: infra-repo
        run: |
          sed -i "s|${{ env.DOCKERHUB_NAMESPACE }}/neuroqueue-frontend:.*|${{ env.DOCKERHUB_NAMESPACE }}/neuroqueue-frontend:${{ steps.vars.outputs.tag }}|g" k8s/frontend.yaml
          sed -i "s|${{ env.DOCKERHUB_NAMESPACE }}/neuroqueue-backend:.*|${{ env.DOCKERHUB_NAMESPACE }}/neuroqueue-backend:${{ steps.vars.outputs.tag }}|g" k8s/backend.yaml
          sed -i "s|${{ env.DOCKERHUB_NAMESPACE }}/neuroqueue-worker:.*|${{ env.DOCKERHUB_NAMESPACE }}/neuroqueue-worker:${{ steps.vars.outputs.tag }}|g" k8s/worker.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add k8s/frontend.yaml k8s/backend.yaml k8s/worker.yaml
          git commit -m "chore: update NeuroQueue images to ${{ steps.vars.outputs.tag }}"
          git push
