apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: neuroqueue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: neuroqueue/neuroqueue-backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: neuroqueue-config
            - secretRef:
                name: neuroqueue-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: neuroqueue
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
