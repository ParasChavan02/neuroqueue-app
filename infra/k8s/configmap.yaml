apiVersion: v1
kind: ConfigMap
metadata:
  name: neuroqueue-config
  namespace: neuroqueue
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_ORIGIN: "http://neuroqueue.local"
  MONGO_URI: "mongodb://mongodb:27017/neuroqueue"
  REDIS_URL: "redis://redis:6379"
  QUEUE_NAME: "task_queue"
  MAX_RETRIES: "3"
  WORKER_POLL_TIMEOUT: "5"
  VITE_API_URL: "http://neuroqueue.local/api"

